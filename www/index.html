<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Video IA</title>
<style>
:root{--bg:#0b0d14;--card:#151926;--line:#262c40;--tx:#eef0f7;--mut:#8b93ad;--ac:#7c5cff;--ac2:#22d3ee;--err:#ff6b6b;--ok:#34d399}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
textarea,select,input[type=number],input[type=text]{width:100%;background:#0e1220;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;color:#fff;background:linear-gradient(90deg,var(--ac),#5b8cff);font-weight:600;width:100%;margin-top:12px}
button.sec{background:#222942;color:var(--tx)}
button:disabled{opacity:.5}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--tx);font-size:14px}
.bar{height:8px;background:#0e1220;border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
#log{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--mut);max-height:160px;overflow:auto;margin-top:10px;white-space:pre-wrap}
#log .e{color:var(--err)} #log .o{color:var(--ok)}
canvas,video{width:100%;border-radius:12px;background:#000;display:block}
details summary{cursor:pointer;color:var(--mut);font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>Video IA</h1>
  <p class="sub">Escribe una idea y la IA crea el guion, las imágenes, la voz en español y une todo en un vídeo. Sin límite de duración.</p>

  <div class="card">
    <label for="prompt">¿Sobre qué quieres el vídeo?</label>
    <textarea id="prompt" placeholder="Ej.: La historia de un faro abandonado en la costa gallega que cobra vida cada noche de tormenta"></textarea>
    <div class="row">
      <div><label for="n">Escenas (más = más largo)</label><input id="n" type="number" min="2" max="200" value="8"></div>
      <div><label for="fmt">Formato</label>
        <select id="fmt"><option value="1280x720">Horizontal 16:9</option><option value="720x1280">Vertical 9:16</option><option value="1024x1024">Cuadrado 1:1</option></select></div>
    </div>
    <div class="row">
      <div><label for="style">Estilo visual</label>
        <select id="style">
          <option value="cinematic photorealistic, dramatic lighting, 35mm film">Cinematográfico</option>
          <option value="3D animated movie style, vibrant colors, soft lighting">Animación 3D</option>
          <option value="anime style, detailed background, vivid colors">Anime</option>
          <option value="oil painting, rich textures, painterly">Pintura al óleo</option>
          <option value="documentary photography, natural light">Documental</option>
          <option value="comic book illustration, bold ink lines, flat colors">Cómic</option>
        </select></div>
      <div><label for="voice">Voz</label>
        <select id="voice"><option value="nova">Nova (mujer)</option><option value="shimmer">Shimmer (mujer)</option><option value="alloy">Alloy (neutra)</option><option value="onyx">Onyx (hombre grave)</option><option value="echo">Echo (hombre)</option><option value="fable">Fable (expresiva)</option></select></div>
    </div>
    <label class="chk"><input type="checkbox" id="subs" checked> Subtítulos en el vídeo</label>
    <label class="chk"><input type="checkbox" id="own"> Ya he escrito el guion: usar mi texto tal cual (una escena por párrafo)</label>
    <button id="go">Crear vídeo</button>
    <button id="stop" class="sec hide">Cancelar</button>
    <div class="bar"><i id="pb"></i></div>
    <div id="log"></div>
  </div>

  <div class="card hide" id="out">
    <canvas id="cv" width="1280" height="720"></canvas>
    <video id="vid" controls playsinline class="hide"></video>
    <button id="save" class="hide">Guardar / compartir vídeo</button>
  </div>

  <div class="card">
    <details>
      <summary>Ajustes avanzados y diagnóstico</summary>
      <label for="u_text">Servicio de texto (guion)</label><input type="text" id="u_text">
      <label for="u_img">Servicio de imágenes</label><input type="text" id="u_img">
      <label for="u_tts">Servicio de voz</label><input type="text" id="u_tts">
      <button class="sec" id="test">Probar servicios</button>
      <button class="sec" id="reset">Restaurar valores</button>
    </details>
  </div>
  <p class="sub">Mantén la app abierta y la pantalla encendida mientras se graba el vídeo: se graba a tiempo real.</p>
</main>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
</body>
</html>
